<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="title-arq">
  <title id="title-arq">Arquitetura de Inteligência Promocional PromoClicks: do estímulo gamificado à inteligência de dados</title>
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF3131"/>
      <stop offset="100%" stop-color="#FF914D"/>
    </linearGradient>
    <linearGradient id="bgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#262220"/>
    </linearGradient>
  </defs>
  <rect width="960" height="420" rx="24" fill="url(#bgDark)"/>
  <rect x="36" y="32" width="56" height="8" rx="4" fill="url(#g1)"/>
  <text x="104" y="40" font-family="Poppins, Arial, sans-serif" font-size="11" font-weight="800" fill="#FF914D" letter-spacing="2">MÉTODO OPERACIONAL PROMOCLICKS</text>
  <text x="36" y="78" font-family="Alegreya Sans, Arial, sans-serif" font-size="32" font-weight="800" fill="#FFFFFF">Ciclo de Conversão e Inteligência Comercial</text>

  <g transform="translate(36, 112)">
    <rect width="204" height="236" rx="16" fill="#222120" stroke="#3A3533" stroke-width="1.5"/>
    <rect x="20" y="20" width="44" height="28" rx="8" fill="url(#g1)"/>
    <text x="42" y="39" text-anchor="middle" font-family="Poppins, sans-serif" font-size="13" font-weight="800" fill="#FFF">01</text>
    <text x="20" y="80" font-family="Alegreya Sans, sans-serif" font-size="22" font-weight="800" fill="#FFF">Atração Lúdica</text>
    <text x="20" y="108" font-family="Poppins, sans-serif" font-size="12" fill="#C4BEBA">Mecânica promocional</text>
    <text x="20" y="126" font-family="Poppins, sans-serif" font-size="12" fill="#C4BEBA">clara e gamificada que</text>
    <text x="20" y="144" font-family="Poppins, sans-serif" font-size="12" fill="#C4BEBA">desperta atenção imediata</text>
    <text x="20" y="162" font-family="Poppins, sans-serif" font-size="12" fill="#C4BEBA">no PDV e no digital.</text>
    <rect x="20" y="194" width="164" height="24" rx="6" fill="#171717"/>
    <text x="102" y="210" text-anchor="middle" font-family="Poppins, sans-serif" font-size="10" font-weight="700" fill="#FF914D">INDICADOR: ALCANCE</text>
  </g>

  <path d="M245 230 L259 230" stroke="url(#g1)" stroke-width="3" stroke-linecap="round"/>

  <g transform="translate(264, 112)">
    <rect width="204" height="236" rx="16" fill="#222120" stroke="#3A3533" stroke-width="1.5"/>
    <rect x="20" y="20" width="44" height="28" rx="8" fill="url(#g1)"/>
    <text x="42" y="39" text-anchor="middle" font-family="Poppins, sans-serif" font-size="13" font-weight="800" fill="#FFF">02</text>
    <text x="20" y="80" font-family="Alegreya Sans, sans-serif" font-size="22" font-weight="800" fill="#FFF">Compra Elegível</text>
    <text x="20" y="108" font-family="Poppins, sans-serif" font-size="12" fill="#C4BEBA">Estímulo direto ao ticket</text>
    <text x="20" y="126" font-family="Poppins, sans-serif" font-size="12" fill="#C4BEBA">médio e à decisão de</text>
    <text x="20" y="144" font-family="Poppins, sans-serif" font-size="12" fill="#C4BEBA">compra na loja aderente</text>
    <text x="20" y="162" font-family="Poppins, sans-serif" font-size="12" fill="#C4BEBA">com emissão de cupom.</text>
    <rect x="20" y="194" width="164" height="24" rx="6" fill="#171717"/>
    <text x="102" y="210" text-anchor="middle" font-family="Poppins, sans-serif" font-size="10" font-weight="700" fill="#FF914D">INDICADOR: CONVERSÃO</text>
  </g>

  <path d="M473 230 L487 230" stroke="url(#g1)" stroke-width="3" stroke-linecap="round"/>

  <g transform="translate(492, 112)">
    <rect width="204" height="236" rx="16" fill="#222120" stroke="#3A3533" stroke-width="1.5"/>
    <rect x="20" y="20" width="44" height="28" rx="8" fill="url(#g1)"/>
    <text x="42" y="39" text-anchor="middle" font-family="Poppins, sans-serif" font-size="13" font-weight="800" fill="#FFF">03</text>
    <text x="20" y="80" font-family="Alegreya Sans, sans-serif" font-size="22" font-weight="800" fill="#FFF">Cadastro Digital</text>
    <text x="20" y="108" font-family="Poppins, sans-serif" font-size="12" fill="#C4BEBA">Acesso via QR Code ou</text>
    <text x="20" y="126" font-family="Poppins, sans-serif" font-size="12" fill="#C4BEBA">link da loja, registro de</text>
    <text x="20" y="144" font-family="Poppins, sans-serif" font-size="12" fill="#C4BEBA">comprovante fiscal e</text>
    <text x="20" y="162" font-family="Poppins, sans-serif" font-size="12" fill="#C4BEBA">número da sorte.</text>
    <rect x="20" y="194" width="164" height="24" rx="6" fill="#171717"/>
    <text x="102" y="210" text-anchor="middle" font-family="Poppins, sans-serif" font-size="10" font-weight="700" fill="#FF914D">INDICADOR: PARTICIPAÇÃO</text>
  </g>

  <path d="M701 230 L715 230" stroke="url(#g1)" stroke-width="3" stroke-linecap="round"/>

  <g transform="translate(720, 112)">
    <rect width="204" height="236" rx="16" fill="#2C211D" stroke="#FF914D" stroke-width="1.5"/>
    <rect x="20" y="20" width="44" height="28" rx="8" fill="url(#g1)"/>
    <text x="42" y="39" text-anchor="middle" font-family="Poppins, sans-serif" font-size="13" font-weight="800" fill="#FFF">04</text>
    <text x="20" y="80" font-family="Alegreya Sans, sans-serif" font-size="22" font-weight="800" fill="#FFF">Big Data &amp; LTV</text>
    <text x="20" y="108" font-family="Poppins, sans-serif" font-size="12" fill="#EADFD9">Leitura da jornada,</text>
    <text x="20" y="126" font-family="Poppins, sans-serif" font-size="12" fill="#EADFD9">aprendizados operacionais</text>
    <text x="20" y="144" font-family="Poppins, sans-serif" font-size="12" fill="#EADFD9">e inteligência para</text>
    <text x="20" y="162" font-family="Poppins, sans-serif" font-size="12" fill="#EADFD9">recompra e novas ações.</text>
    <rect x="20" y="194" width="164" height="24" rx="6" fill="url(#g1)"/>
    <text x="102" y="210" text-anchor="middle" font-family="Poppins, sans-serif" font-size="10" font-weight="800" fill="#FFFFFF">DECISÃO COMERCIAL</text>
  </g>

  <text x="36" y="386" font-family="Poppins, sans-serif" font-size="11" fill="#A69F9B">Governança Regulatória (SPA) + Engenharia Promocional e Inteligência de Dados</text>
</svg>
