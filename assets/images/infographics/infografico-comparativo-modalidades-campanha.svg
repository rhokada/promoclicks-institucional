<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" width="960" height="390" role="img" aria-labelledby="title-mod">
  <title id="title-mod">Matriz Comparativa de Soluções PromoClicks: Campanhas Coletivas, Campanhas Exclusivas e Inteligência de Dados Aplicada</title>
  <defs>
    <linearGradient id="gMod" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF3131"/>
      <stop offset="100%" stop-color="#FF914D"/>
    </linearGradient>
  </defs>
  <rect width="960" height="390" rx="24" fill="#FAF8F5" stroke="#E8E3DF" stroke-width="2"/>
  <rect x="36" y="30" width="48" height="6" rx="3" fill="url(#gMod)"/>
  <text x="96" y="37" font-family="Poppins, sans-serif" font-size="11" font-weight="800" fill="#FF3131" letter-spacing="1.8">MATRIZ DE SOLUÇÕES B2B · PROMOCLICKS</text>
  <text x="36" y="74" font-family="Alegreya Sans, sans-serif" font-size="30" font-weight="800" fill="#171717">Como Escolher a Arquitetura Promocional Ideal para o seu Negócio</text>

  <g transform="translate(36, 102)">
    <rect width="280" height="248" rx="18" fill="#181818"/>
    <rect x="24" y="22" width="126" height="24" rx="12" fill="url(#gMod)"/>
    <text x="87" y="38" text-anchor="middle" font-family="Poppins, sans-serif" font-size="10" font-weight="800" fill="#FFFFFF">ADESÃO POR PLANO</text>
    <text x="24" y="76" font-family="Alegreya Sans, sans-serif" font-size="25" font-weight="800" fill="#FFFFFF">Campanhas Coletivas</text>
    <text x="24" y="106" font-family="Poppins, sans-serif" font-size="11.5" fill="#CCCCCC">• Estrutura e premiação compartilhadas</text>
    <text x="24" y="130" font-family="Poppins, sans-serif" font-size="11.5" fill="#CCCCCC">• Investimento acessível (Bronze a Diamante)</text>
    <text x="24" y="154" font-family="Poppins, sans-serif" font-size="11.5" fill="#CCCCCC">• Página da loja + QR Code individual</text>
    <text x="24" y="178" font-family="Poppins, sans-serif" font-size="11.5" fill="#CCCCCC">• Rápida ativação para datas sazonais</text>
    <text x="24" y="218" font-family="Poppins, sans-serif" font-size="11" font-weight="700" fill="#FF914D">Destaque: Natal Premiado 2026</text>
  </g>

  <g transform="translate(340, 102)">
    <rect width="280" height="248" rx="18" fill="#FFFFFF" stroke="#E4DDD7" stroke-width="1.5"/>
    <rect x="24" y="22" width="136" height="24" rx="12" fill="#FFF0E8"/>
    <text x="92" y="38" text-anchor="middle" font-family="Poppins, sans-serif" font-size="10" font-weight="800" fill="#FF3131">PROJETO SOB MEDIDA</text>
    <text x="24" y="76" font-family="Alegreya Sans, sans-serif" font-size="25" font-weight="800" fill="#171717">Campanhas Exclusivas</text>
    <text x="24" y="106" font-family="Poppins, sans-serif" font-size="11.5" fill="#404040">• Mecânica e identidade 100% da marca</text>
    <text x="24" y="130" font-family="Poppins, sans-serif" font-size="11.5" fill="#404040">• Regras ajustadas ao ticket e mix</text>
    <text x="24" y="154" font-family="Poppins, sans-serif" font-size="11.5" fill="#404040">• Gamificação, sorteios e prêmios próprios</text>
    <text x="24" y="178" font-family="Poppins, sans-serif" font-size="11.5" fill="#404040">• Adequação regulatória (SPA) dedicada</text>
    <text x="24" y="218" font-family="Poppins, sans-serif" font-size="11" font-weight="700" fill="#171717">Ideal para redes, marcas e shoppings</text>
  </g>

  <g transform="translate(644, 102)">
    <rect width="280" height="248" rx="18" fill="#FFFFFF" stroke="#E4DDD7" stroke-width="1.5"/>
    <rect x="24" y="22" width="144" height="24" rx="12" fill="#F2EFEA"/>
    <text x="96" y="38" text-anchor="middle" font-family="Poppins, sans-serif" font-size="10" font-weight="800" fill="#404040">BIG DATA &amp; MÉTRICAS</text>
    <text x="24" y="76" font-family="Alegreya Sans, sans-serif" font-size="25" font-weight="800" fill="#171717">Inteligência Aplicada</text>
    <text x="24" y="106" font-family="Poppins, sans-serif" font-size="11.5" fill="#404040">• Leitura de alcance, cadastro e adesão</text>
    <text x="24" y="130" font-family="Poppins, sans-serif" font-size="11.5" fill="#404040">• Visão do comportamento de compra</text>
    <text x="24" y="154" font-family="Poppins, sans-serif" font-size="11.5" fill="#404040">• Diagnóstico de pontos de abandono</text>
    <text x="24" y="178" font-family="Poppins, sans-serif" font-size="11.5" fill="#404040">• Insumos para recompra e retenção</text>
    <text x="24" y="218" font-family="Poppins, sans-serif" font-size="11" font-weight="700" fill="#FF3131">Integrada às operações promocionais</text>
  </g>
</svg>
